<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>织梦 · 原创小说工作台 — 官方下载</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #faf9f7; color: #1c1a17; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
  }
  .bar { width: 100%; height: 3px; background: linear-gradient(90deg, #a8792f, #d4a45f); }
  .hero { text-align: center; padding: 72px 24px 40px; }
  .hero h1 { font-size: 44px; letter-spacing: 0.35em; text-indent: 0.35em; font-weight: 700; }
  .hero h1 span { color: #a8792f; }
  .hero p { margin-top: 14px; color: #8a8578; font-size: 15px; letter-spacing: 0.2em; }
  .version { margin-top: 10px; font-size: 12px; color: #b5af9e; }
  .cards { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; padding: 24px; max-width: 900px; }
  .card {
    width: 260px; background: #fff; border: 1px solid #ece7dd; border-radius: 16px;
    padding: 28px 24px; text-align: center; transition: all .2s ease;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(168,121,47,.10); border-color: #d4a45f; }
  .card .icon { font-size: 34px; }
  .card h2 { font-size: 17px; margin: 14px 0 6px; }
  .card .desc { font-size: 12px; color: #a09a8b; min-height: 32px; line-height: 1.6; }
  .card a {
    display: inline-block; margin-top: 16px; padding: 10px 26px; border-radius: 999px;
    background: #1c1a17; color: #fff; text-decoration: none; font-size: 13px;
  }
  .card a:hover { background: #a8792f; }
  .card .size { display: block; margin-top: 10px; font-size: 11px; color: #c3bcab; }
  .note { max-width: 560px; margin: 32px auto 60px; padding: 0 24px; color: #8a8578; font-size: 13px; line-height: 2; text-align: center; }
  .note b { color: #a8792f; }
  footer { padding: 24px; color: #c3bcab; font-size: 12px; }
</style>
</head>
<body>
<div class="bar"></div>
<div class="hero">
  <h1>织<span>梦</span></h1>
  <p>原创小说工作台</p>
  <div class="version" id="version">正在获取最新版本…</div>
</div>
<div class="cards" id="cards"></div>
<div class="note">
  打开软件后,用<b>邮箱 + 邀请码</b>登录;邀请码请向作者索取。<br>
  Mac 若提示"已损坏",在终端执行:<code>xattr -dr com.apple.quarantine /Applications/织梦.app</code><br>
  Windows 版首次使用需安装 Python 3.9+(软件内会有引导)。
</div>
<footer>织梦 ZHIMENG STUDIO</footer>
<script>
const API = 'https://api.github.com/repos/lidihong/zhimeng-releases/releases/latest';
const isMac = /Mac/i.test(navigator.userAgent);
const isWin = /Win/i.test(navigator.userAgent);
function human(s) {
  if (s < 1024) return s + ' B';
  const u = ['KB','MB','GB']; let v = s;
  for (const x of u) { v /= 1024; if (v < 1024 || x === 'GB') return v.toFixed(1) + ' ' + x; }
}
const DEFS = [
  { key: 'mac-arm64', icon: '🍎', title: 'Mac · 苹果芯片', desc: 'M1 / M2 / M3 / M4 芯片的 MacBook、iMac、Mac mini' },
  { key: 'mac-x64', icon: '💻', title: 'Mac · 英特尔芯片', desc: '2020 年前的老款 Intel Mac' },
  { key: 'win-x64', icon: '🪟', title: 'Windows', desc: 'Windows 10 / 11(64 位),一键安装' },
];
fetch(API).then(r => r.json()).then(rel => {
  document.getElementById('version').textContent = '最新版本 ' + (rel.tag_name || '');
  const assets = rel.assets || [];
  const cards = DEFS.map(d => {
    const a = assets.find(x => x.name.includes(d.key) && x.name.endsWith(d.key.startsWith('win') ? '.exe' : '.dmg'));
    if (!a) return '';
    const recommend = (isWin && d.key.startsWith('win')) || (isMac && d.key.startsWith('mac'));
    return `<div class="card"${recommend ? ' style="border-color:#d4a45f"' : ''}>
      <div class="icon">${d.icon}</div>
      <h2>${d.title}${recommend ? ' · 推荐' : ''}</h2>
      <div class="desc">${d.desc}</div>
      <a href="${a.browser_download_url}">立即下载</a>
      <span class="size">${human(a.size)}</span>
    </div>`;
  }).join('');
  document.getElementById('cards').innerHTML = cards || '<p>暂无安装包,请稍后再来。</p>';
}).catch(() => {
  document.getElementById('version').textContent = '获取版本失败,请刷新重试';
});
</script>
</body>
</html>
